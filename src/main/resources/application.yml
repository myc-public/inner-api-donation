server:
  port: ${DONATION_PORT:8080}

### CUSTOM prop ###
myc:
  context: "/" # nginx location prefix (empty on local)
  response:
    decompression:
      enabled: false
  request:
    compression:
      enabled: false
  # Securite metier active par defaut (tokens Keycloak) ; CORS ferme (pas d'allowed-origin-pattern)
  security:
    csp:
      enabled: false
      directives: default-src 'none'
    whitelist-path:
      - /docs/**
      - /webjars/**
  docs:
    version: "1.0.0"
    security:
      schema: ADFS
      auth-uri: ${AUTH_ADFS_URL_AUTHORIZE:https://srv-dcdev.myc-dev.local/adfs/oauth2/authorize}
      token-uri: ${AUTH_ADFS_URL_TOKEN:https://srv-dcdev.myc-dev.local/adfs/oauth2/token}

### DOC prop ###
springdoc:
  paths-to-match: /**
  api-docs:
    path: "docs/api-docs"
    enabled: true
  swagger-ui:
    path: "/docs/swagger-ui.html"
    url: "${myc.context}${springdoc.api-docs.path}"
    configUrl: "${myc.context}${springdoc.api-docs.path}/swagger-config"
    disable-swagger-default-url: true
    operationsSorter: alpha
    tagsSorter: alpha
    
### SPRING ###
spring:
  application:
    # En dur : pas de filtrage Maven @...@ (craft-parent n'herite pas de spring-boot-starter-parent)
    name: inner-donation-api
  profiles:
    default: local
    group:
      local: local,api-docs
      dev: dev,api-docs
      uat: uat,api-docs
      preprod: preprod
      prod: prod
  config:
    # Dev local : memes variables que local/compose.yaml (repertoire de travail = racine du module)
    import: optional:file:local/.env[.properties]
   ## BDD ##
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:donation_api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # Pas de valeur par defaut : fournis par local/.env (dev) ou donation-api-db-secret (OpenShift)
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: mycDonationHikari
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration


  # Resource server : tokens Keycloak (realm myc). Defauts = Keycloak local (gitops-platform/local/keycloak) ;
  # sur OpenShift, l'overlay fournit OIDC_ISSUER_URI (URL publique) et OIDC_JWK_SET_URI (URL interne, backchannel).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/myc}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/myc/protocol/openid-connect/certs}
          audiences: donation-api


### SPANS SQL (datasource-micrometer) ###
jdbc:
  # Un span par requete SQL (sans le bruit connexion / fetch)
  includes: QUERY
  datasource-proxy:
    # Jamais les valeurs des parametres dans les traces (email, montant...) : seulement le SQL
    include-parameter-values: false

app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    lock-ttl: ${OUTBOX_LOCK_TTL:PT30S}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:PT1S}
    max-backoff: ${OUTBOX_MAX_BACKOFF:PT30S}

### LOG LEVEL ###
logging:
  level:
    root: INFO
    # Noms de logger = packages (pas de joker : "ma.myc.*" n'etait jamais applique)
    ma.myc: INFO
    org.springframework.security: INFO
  # Pas de logging.pattern.level : Boot ajoute deja [traceId-spanId] (correlation native) -> plus de doublon
  structured:
    ecs:
      service:
        environment: ${SPRING_PROFILES_ACTIVE:local}
        # HOSTNAME = nom du pod sur Kubernetes : distingue les replicas dans Loki
        node-name: ${HOSTNAME:}
    

### INFO ENV ###
info:
  application:
    name: ${spring.application.name}
# version / description : fournies par build-info (spring-boot-maven-plugin) -> /management/info "build"
    
### API MANAGEMENT ###
management:
  security:
    users:
      # Pas de valeur par defaut : fournis par local/.env (dev) ou donation-api-management-secret (OpenShift)
      - username: ${MANAGEMENT_ADMIN_USER}
        password: ${MANAGEMENT_ADMIN_PWD}
        role: ADMIN
      - username: ${MANAGEMENT_VIEWER_USER}
        password: ${MANAGEMENT_VIEWER_PWD}
        role: VIEWER
  endpoint:
    prometheus:
      enabled: true
    loggers:
      enabled: true
    health:
      enabled: true
      # Details (DB, disque) reserves aux utilisateurs authentifies : /management/health est public (sondes, Route)
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
      base-path: /management
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogramme de latence HTTP : p95 / p99 calculables (SLO)
      percentiles-histogram:
        http.server.requests: true
      # Borne exacte du SLO de latence (95 % < 300 ms) : sans elle, les buckets par defaut sautent de 268 a 358 ms
      slo:
        http.server.requests: 300ms
  # --- Observabilite OpenTelemetry (OTLP) : desactivee par defaut (local, tests), activee par l'overlay ---
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
  logging:
    export:
      otlp:
        enabled: ${OTLP_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: inner-apis
      service.version: ${spring.application.version:unknown}
      deployment.environment.name: ${SPRING_PROFILES_ACTIVE:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs


---
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
  
---
spring:
  config:
    activate:
      on-profile: '!local'
  devtools:
    add-properties : false
    livereload.enabled: false
    restart.enabled: false
    
myc:
  # Prefixe nginx par defaut ; MYC_CONTEXT=/ quand l'API est exposee directement (Route OpenShift en dev)
  context: ${MYC_CONTEXT:/api/donation/}

logging:
  structured:
    format:
      # Logs as Event Streams : un evenement JSON (ECS) par ligne sur stdout, route par la plateforme (Loki)
      console: ecs
   